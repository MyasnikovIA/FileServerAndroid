<div id="changePasswordModal" class="modal-overlay hidden" onclick="FAR.closeChangePasswordOutside(event)">
    <div class="modal-content" onclick="event.stopPropagation()" style="max-width: 400px;">
        <div class="modal-header">
            <h3>🔐 Смена пароля</h3>
            <button class="close-btn" onclick="FAR.closeChangePassword()">✕</button>
        </div>
        <div class="modal-body">
            <div style="display:flex; flex-direction:column; gap:12px;">
                <label style="font-size:12px; color:#a6adc8;">Текущий пароль
                    <input type="password" id="cpOldPass" style="width:100%; padding:8px; background:#181825; border:1px solid #45475a; border-radius:5px; color:#cdd6f4; margin-top:4px;">
                </label>
                <label style="font-size:12px; color:#a6adc8;">Новый пароль
                    <input type="password" id="cpNewPass" style="width:100%; padding:8px; background:#181825; border:1px solid #45475a; border-radius:5px; color:#cdd6f4; margin-top:4px;">
                </label>
                <label style="font-size:12px; color:#a6adc8;">Повторите новый пароль
                    <input type="password" id="cpNewPass2" style="width:100%; padding:8px; background:#181825; border:1px solid #45475a; border-radius:5px; color:#cdd6f4; margin-top:4px;">
                </label>
                <div id="cpError" style="color:#f38ba8; font-size:12px; min-height:16px;"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="FAR.closeChangePassword()">Отмена</button>
            <button class="btn-connect" onclick="FAR.submitChangePassword()">Сохранить</button>
        </div>
    </div>
</div>
